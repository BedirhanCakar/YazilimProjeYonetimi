# SonarQube Yapılandırması
# Görüntü Sahteciliği Tespiti Projesi - Kod Kalitesi Analizi

# ==================================================
# Proje Bilgileri
# ==================================================

# Proje anahtarı (SonarQube'de benzersiz tanımlayıcı)
sonar.projectKey=forgery-detection-project
sonar.projectName=Görüntü Sahteciliği Tespiti
sonar.projectVersion=1.0.0

# Proje açıklaması
sonar.projectDescription=Klasik CV ve Derin Öğrenme tabanlı görüntü sahtecilik tespiti sistemi

# ==================================================
# Kaynak Kodu Ayarları
# ==================================================

# Proje temel dizini
sonar.sources=backend,frontend
sonar.tests=tests

# Python özgü ayarlar
sonar.lang.patterns.python=**/*.py
sonar.python.version=3.11

# Dil tanımaları
sonar.language=py

# Dışlanacak dosya ve klasörler
sonar.exclusions=**/__pycache__/**, \
                **/*.pyc, \
                **/node_modules/**, \
                **/.git/**, \
                **/venv/**, \
                **/env/**, \
                **/tests/**, \
                **/docs/**

# Kod kapsamı (test coverage)
sonar.coverage.exclusions=**/__init__.py,tests/**,setup.py

# ==================================================
# Kod Kalitesi Eşikleri
# ==================================================

# Başarısız olunacak kod kalitesi kapısı
sonar.qualitygate.wait=true

# Yapılacak kalitesi: kod içindeki TODOs
sonar.issues.include.externalissuesonly=false

# Minimum kod kapsamı
sonar.projectVersion.coverage.minimum=60

# ==================================================
# Python Analiz Kuralları
# ==================================================

# Pylint kullanımı (varsa)
sonar.python.pylint.reportPath=.pylint-report.txt

# Flake8 raporu (varsa)
sonar.python.flake8.reportPath=.flake8-report.txt

# ==================================================
# Güvenlik Ayarları
# ==================================================

# Güvenlik açığı taraması
sonar.security.enable=true

# Hassas veri kalıpları
sonar.inclusions.sensitive.data=password,token,secret,apikey,api_key

# ==================================================
# Raporlama
# ==================================================

# Rapor direktörü
sonar.working.directory=.sonarqube

# Dış raporlara bağlantı
sonar.externalIssuesReportPaths=

# ==================================================
# CI/CD Entegrasyonu
# ==================================================

# GitHub Actions, GitLab CI vb. için
sonar.pullrequest.provider=github
sonar.analysis.mode=publish

# ==================================================
# Performans
# ==================================================

# İş parçacığı sayısı
sonar.analysis.max.workers=4

# Zaman aşımı (dakika)
sonar.analysis.timeout=30

# ==================================================
# Belgelendirme
# ==================================================

# API belgelendirme kontrol
sonar.documentation.enable=true

# Dosya belgelendirme oranı minimum %70
sonar.documentation.coverage.ratio=70

# ==================================================
# Başlangıç Notları
# ==================================================

# SonarQube sunucusuna bağlantı kurabilmek için:
# sonar.host.url=http://localhost:9000
# sonar.login=admin
# sonar.password=admin

# Komut satırından çalıştırma:
# sonar-scanner -Dproject.settings=sonar-project.properties

# Docker ile çalıştırma:
# docker run --rm \
#   -v "$(pwd):/usr/src" \
#   -e SONAR_HOST_URL=http://sonarqube:9000 \
#   -e SONAR_LOGIN=admin \
#   sonarsource/sonar-scanner-cli

# ==================================================
# Ek Bilgilendirmeler
# ==================================================

# Bu konfigürasyon dosyası SonarQube analiz araçı tarafından 
# kullanılır ve proje kod kalitesi metriklerini otomatik olarak
# toplar ve değerlendirir.
#
# Analiz sonuçları şunları içerir:
# - Kod Yoğunluğu (Cyclomatic Complexity)
# - Yinelenen Kod (Duplication)
# - Kod Denetim Standartları (Code Smells)
# - Güvenlik Açıkları
# - Birim Test Kapsamı
# - Dokümantasyon Oranı
#
# Tüm metriklerin iyileştirilmesi hedeflenmektedir.
